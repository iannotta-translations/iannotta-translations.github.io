#################### default parameters ############################
favicon = "images/favicon.png"
logo = "images/logo.png"
logo_darkmode = "images/logo-darkmode.png"
logo_width = "160px"
logo_height = "32px"
logo_webp = true
logo_text = "Alessia Iannotta"
navbar_fixed = true
theme_switcher = true
theme_default = "system" # available options [light/dark/system]
mainSections = ["blog"]
contact_form_action = "#"
google_tag_manager = ""
google_adsense = ""     
custom_script = ""
copyright = "© Alessia Iannotta — Traduzioni Freelance EN ↔ IT | FR ↔ IT"

# Preloader
[preloader]
enable = false
preloader = ""

# Navigation button
[navigation_button]
enable = true
label = "Richiedi Preventivo"
link = "/contact"

# LLMs Configuration
[llms]
generate_llms_txt = true
generate_llms_full_txt = true
include = []
exclude = []

# search
[search]
enable = false
primary_color = "#1e3a8a"
include_sections = []
show_image = true
show_description = true
show_tags = true
show_categories = true

# announcement
[announcement]
enable = false
expire_days = 7
content = ""

# seo meta data for OpenGraph / Twitter Card
[metadata]
keywords = ["Traduttrice", "Traduzioni", "Localizzazione", "EN-IT", "FR-IT", "Alessia Iannotta", "Freelance", "Proofreading"]
description = "Servizi professionali di traduzione, localizzazione web e revisione dall'Inglese e Francese verso l'Italiano."
author = "Alessia Iannotta"
twitter = ""
image = "images/og-image.png"

# site verifications
[site_verification]
google = ""   
bing = ""     
baidu = ""    
facebook = "" 
mastodon = "" 

# cookies
[cookies]
enable = false
expire_days = 60
content = "Questo sito utilizza i cookie per migliorare l'esperienza utente."
button = "Accetta"

# diagrams
[mermaid]
js_url = 'https://cdn.jsdelivr.net/npm/mermaid@latest/dist/mermaid.esm.min.mjs'

######################## sidebar widgets #########################
[widgets]
sidebar = ["categories", "tags"]

# google map
[google_map]
enable = false
map_api_key = ""
map_latitude = ""
map_longitude = ""
map_marker = "images/marker.png"

# Subscription
[subscription]
enable = false
mailchimp_form_action = ""
mailchimp_form_name = ""

# OpenRemark Comments
[open_remark]
enable = false
site_key = ""
embed_url = ""

